name: Release

# 推送 v* 标签时触发：双平台构建并自动创建 GitHub Release
# 也可手动触发（workflow_dispatch），将产物补挂到指定 tag 的既有 Release 上
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '发布到的 tag（如 v1.0.0，须已存在）'
        required: true

permissions:
  contents: write

env:
  TAG_NAME: ${{ inputs.tag || github.ref_name }}

jobs:
  build-windows:
    name: Build Windows exe (${{ matrix.rid }})
    runs-on: windows-latest
    strategy:
      matrix:
        rid: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish single-file exe
        run: dotnet publish windows/src/TokenBar/TokenBar.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      - name: Rename artifact and show SHA256
        shell: pwsh
        run: |
          Move-Item publish/TokenBar.exe "TokenBar-$env:TAG_NAME-${{ matrix.rid }}.exe"
          Get-FileHash "TokenBar-$env:TAG_NAME-${{ matrix.rid }}.exe" -Algorithm SHA256 | Format-List

      - uses: actions/upload-artifact@v4
        with:
          name: windows-artifact-${{ matrix.rid }}
          path: TokenBar-*-win-*.exe
          if-no-files-found: error

  build-macos:
    name: Build macOS app (universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build TokenBar.app (arm64 + x86_64)
        run: bash mac/Scripts/build_app.sh

      - name: Package zip and show SHA256
        run: |
          ditto -c -k --keepParent mac/build/TokenBar.app "TokenBar-$TAG_NAME-macOS-universal.zip"
          shasum -a 256 "TokenBar-$TAG_NAME-macOS-universal.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-artifact
          path: TokenBar-*-macOS-universal.zip
          if-no-files-found: error

  release:
    name: Upload to GitHub Release
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        run: sha256sum TokenBar-* | tee SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          generate_release_notes: true
          body: |
            ## 安装说明

            ### Windows
            - 下载 `TokenBar-${{ env.TAG_NAME }}-win-x64.exe`（Intel/AMD 电脑）或 `TokenBar-${{ env.TAG_NAME }}-win-arm64.exe`（ARM 设备，如 Snapdragon 笔记本）；单文件自包含，无需安装 .NET，双击即可运行
            - ARM64 Windows 也可通过系统模拟运行 x64 版，但原生 ARM64 版内存占用更低
            - 如需注册开始菜单/桌面快捷方式与卸载项：将下载的 exe 复制为 `windows/publish/TokenBar.exe` 后执行仓库中的 `windows/install.ps1`

            ### macOS (13+，Intel 与 Apple Silicon 通用)
            - 下载并解压 `TokenBar-${{ env.TAG_NAME }}-macOS-universal.zip`，将 `TokenBar.app` 拖入「应用程序」
            - 产物未做开发者签名与公证，首次打开若被 Gatekeeper 拦截：系统设置 → 隐私与安全性 → 「仍要打开」，或执行 `xattr -dr com.apple.quarantine /Applications/TokenBar.app`

            ### 校验下载完整性
            - macOS / Linux：`shasum -a 256 -c SHA256SUMS.txt`
            - Windows (PowerShell)：`Get-FileHash <文件名> -Algorithm SHA256`
          files: |
            TokenBar-*-win-*.exe
            TokenBar-*-macOS-universal.zip
            SHA256SUMS.txt
