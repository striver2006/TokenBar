name: Release

# 推送 v* 标签时触发：双平台构建并自动创建 GitHub Release
# 也可手动触发（workflow_dispatch），将产物补挂到指定 tag 的既有 Release 上
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '发布到的 tag（如 v1.0.0，须已存在）'
        required: true

permissions:
  contents: write

env:
  TAG_NAME: ${{ inputs.tag || github.ref_name }}

jobs:
  build-windows:
    name: Build Windows exe (${{ matrix.rid }})
    runs-on: windows-latest
    strategy:
      matrix:
        rid: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      # 注意：必须 IncludeNativeLibrariesForSelfExtract=false，让 wpfgfx_cor3.dll 等原生库
      # 随 exe 同目录分发。若打进单文件，运行时会解压到 %TEMP%，被系统清理工具删掉后
      # 会触发 "System.DllNotFoundException: Dll was not found"（WPF 渲染崩溃）。
      - name: Publish self-contained app
        run: dotnet publish windows/src/TokenBar/TokenBar.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=false -o publish

      - name: Package portable zip and show SHA256
        shell: pwsh
        run: |
          Remove-Item publish/TokenBar.pdb
          Compress-Archive -Path publish/* -DestinationPath "TokenBar-$env:TAG_NAME-${{ matrix.rid }}.zip"
          Get-FileHash "TokenBar-$env:TAG_NAME-${{ matrix.rid }}.zip" -Algorithm SHA256 | Format-List

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $version = $env:TAG_NAME.TrimStart("v")
          $arch = "${{ matrix.rid }}" -replace '^win-', ''
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = (Get-Command iscc).Source }
          & $iscc /DAppVersion=$version /DArch=$arch /DSourceDir="$(Resolve-Path publish)" "windows\installer\tokenbar.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Move-Item "windows\installer\Output\*.exe" .

      - uses: actions/upload-artifact@v7
        with:
          name: windows-artifact-${{ matrix.rid }}
          path: |
            TokenBar-*-win-*.zip
            TokenBar-*-win-*-setup.exe
          if-no-files-found: error

  build-macos:
    name: Build macOS app (universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build TokenBar.app (arm64 + x86_64)
        run: bash mac/Scripts/build_app.sh

      - name: Package zip and show SHA256
        run: |
          ditto -c -k --keepParent mac/build/TokenBar.app "TokenBar-$TAG_NAME-macOS-universal.zip"
          shasum -a 256 "TokenBar-$TAG_NAME-macOS-universal.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: macos-artifact
          path: TokenBar-*-macOS-universal.zip
          if-no-files-found: error

  release:
    name: Upload to GitHub Release
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        run: sha256sum TokenBar-* | tee SHA256SUMS.txt

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG_NAME }}
          generate_release_notes: true
          body: |
            ## 安装说明

            ### Windows
            - **推荐**：下载 `TokenBar-${{ env.TAG_NAME }}-win-x64-setup.exe`（Intel/AMD 电脑）或 `TokenBar-${{ env.TAG_NAME }}-win-arm64-setup.exe`（ARM 设备，如 Snapdragon 笔记本），双击安装——自动创建开始菜单快捷方式并注册系统卸载项（按用户安装，无需管理员权限）
            - 便携版：下载 `TokenBar-${{ env.TAG_NAME }}-win-x64.zip` / `-win-arm64.zip`，解压到任意固定目录后运行其中的 `TokenBar.exe`（原生 DLL 与 exe 同目录分发，不经手系统临时目录；请勿单独移动 exe）；如需注册快捷方式与卸载项可执行仓库中的 `windows/install.ps1`
            - ARM64 Windows 也可通过系统模拟运行 x64 版，但原生 ARM64 版内存占用更低

            ### macOS (13+，Intel 与 Apple Silicon 通用)
            - 下载并解压 `TokenBar-${{ env.TAG_NAME }}-macOS-universal.zip`，将 `TokenBar.app` 拖入「应用程序」
            - 产物未做开发者签名与公证，首次打开若被 Gatekeeper 拦截：系统设置 → 隐私与安全性 → 「仍要打开」，或执行 `xattr -dr com.apple.quarantine /Applications/TokenBar.app`

            ### 校验下载完整性
            - macOS / Linux：`shasum -a 256 -c SHA256SUMS.txt`
            - Windows (PowerShell)：`Get-FileHash <文件名> -Algorithm SHA256`
          files: |
            TokenBar-*-win-*
            TokenBar-*-macOS-universal.zip
            SHA256SUMS.txt
